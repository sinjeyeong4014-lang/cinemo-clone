<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo - Home</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
  </head>
  <body>
    <main class="hero-banner">
      <div class="hero-story">
        <div class="hero-discovery">
          <p class="discovery-text">이번 주의 발견</p>
          <p class="discovery-vol">VOL. 01</p>
        </div>
        <div class="hero-title">
          <h2 class="title-ko">고요의 궤도</h2>
          <p class="title-en">QUIET ORBIT</p>
        </div>
        <div class="hero-Genre">
          <span class="genre-item">
            <span class="genre-year">2026</span>
            <span class="genre-type">SF</span>
            <span>미스터리</span>
          </span>
          <span class="genre-age">15+</span>
          <span class="genre-time">1시간 48분</span>
        </div>
        <p class="hero-summary">
          모든 소리가 사라진 해안, 정체를 알 수 없는 신호가 도착한다. 마지막 관측자는 그 고요 속으로 한 걸음 다가선다.</p>
        <div class="hero-buttons">
          <button type="button" class="work-button">
            <img src="./assets/Vector.svg" alt="" class="icon-arrow">
            <span>작품 살펴보기</span>
          </button>
          <button type="button" class="plus-button">
            <img src="./assets/Vector (1).svg" alt="" class="icon-plus">
            <span class="button-text">찜하기</span>          
          </button>
        </div>
      </div>    
      <div class="hero-aside">
        <p class="aside-ko">고요가 시작되는 곳, 이야기가 깨어난다.</p>
        <p class="aside-en">A CINEMO ORIGINAL CONCEPT</p>
      </div>
    </main>
  </body>
</html>
