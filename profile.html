<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINEMO ｜ HOME</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <h1 class="logo">
          <img src="./assets/Brand mark.svg" alt="CINEMO 로고" />
          <span class="logo-text">CINEMO</span>
        </h1>
      </div>
    </header>
    <div class="scene">
      <p class="scene-description">YOUR OWN SCENE</p>
      <h1 class="scene-title">누구의 시간인가요?</h1>
      <p class="scene-subtitle">함께 보는 이야기, 취향은 각자의 방식으로.</p>
    </div>
    <div>
      <nav>
        <ul class="profile-box">
          <li>
            <a href=""></a>
            <button>
              <span class="img-con">
                <img
                  src="assets/Avatar-서연.svg"
                  alt=""
                  width="152"
                  height="152"
                />
                <span class="yy">Y</span>
              </span>
            </button>
            <p class="yolo">욜로</p>
            <p class="note">나만의 영화 노트</p>
          </li>
          <li class="">
            <a href=""></a>
            <button class="jiho">
              <span class="img-con">
                <img
                  src="assets/Avatar-지호.svg"
                  alt=""
                  width="152"
                  height="152"
                />
                <span class="yy">J</span>
              </span>
            </button>
            <p class="yolo">지호</p>
            <p class="note">새로운 장면을 찾아서</p>
          </li>
          <li>
            <a href=""></a>
            <button class="min">
              <span class="img-con">
                <img
                  src="assets/Avatar-민.svg"
                  alt=""
                  width="152"
                  height="152"
                />
                <span class="yy">M</span>
              </span>
            </button>
            <p class="yolo">민</p>
            <p class="note">오늘도 한 편</p>
          </li>
          <li>
            <a href=""></a>
            <button class="guest">
              <span class="img-con">
                <img
                  src="assets/Avatar-게스트.svg"
                  alt=""
                  width="152"
                  height="152"
                />
                <span class="yy">G</span>
              </span>
            </button>
            <p class="yolo">게스트</p>
            <p class="note">가볍게 둘러보기</p>
          </li>
        </ul>
        <ul>
          <li class="profile-manage">
            <a href=""></a>
            <button class="pencil">
              <img src="assets/Pencil.svg" alt="" width="18" height="18" />
            </button>
            <span class="profile-settings">프로필 관리</span>
          </li>
        </ul>
      </nav>
    </div>
    <footer><p class="end">>당신의 다음 장면을 만나는 곳, CINEMO</p></footer>
  </body>
</html>
